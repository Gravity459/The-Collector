# Railway configuration for the backend service.
# Set env vars in the Railway dashboard: DATABASE_URL, JWT_SECRET, JWT_EXPIRE_MINUTES,
# ADMIN_NAME, ADMIN_EMAIL, ADMIN_PASSWORD, CORS_ORIGINS.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
