<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="The Collector — a quiet monthly ledger where pending money becomes approved money">
  <defs>
    <radialGradient id="g" cx="50%" cy="0%" r="75%"><stop offset="0" stop-color="#7C8CFF" stop-opacity=".28"/><stop offset="1" stop-color="#7C8CFF" stop-opacity="0"/></radialGradient>
    <pattern id="rule" width="1280" height="32" patternUnits="userSpaceOnUse"><path d="M0 31.5H1280" stroke="#262626" stroke-width="1"/></pattern>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0A0A0A" stop-opacity="0"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient>
  </defs>
  <rect width="1280" height="320" rx="20" fill="#0A0A0A"/>
  <rect width="1280" height="320" rx="20" fill="url(#rule)" opacity=".55"/>
  <rect width="1280" height="320" rx="20" fill="url(#g)"/>
  <rect y="200" width="1280" height="120" fill="url(#fade)"/>
  <g transform="translate(96 92) scale(3.2)" fill="none" stroke="#EDEDED" stroke-width="1.75" stroke-linecap="round">
    <rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 10h8M8 14h5"/>
  </g>
  <g font-family="Geist, 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif">
    <text x="200" y="150" font-size="56" font-weight="600" letter-spacing="-1.6" fill="#EDEDED">The Collector</text>
    <text x="202" y="192" font-size="20" fill="#A1A1A1">Monthly house collections, from doorstep to approved.</text>
    <g transform="translate(202 222)" font-size="14" font-weight="500">
      <rect width="168" height="30" rx="15" fill="#1C1C1C"/><circle cx="18" cy="15" r="4" fill="#A1A1A1"/><text x="30" y="20" fill="#A1A1A1">Pending approval</text>
      <path d="M186 15h34m-8-6 8 6-8 6" stroke="#A1A1A1" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="236" width="108" height="30" rx="15" fill="#0E2A1C"/><circle cx="254" cy="15" r="4" fill="#4ADE80"/><text x="266" y="20" fill="#4ADE80">Approved</text>
    </g>
  </g>
  <g transform="translate(960 70)" font-family="Geist, 'Inter', 'Segoe UI', system-ui, sans-serif">
    <rect width="260" height="180" rx="12" fill="#0F0F0F" stroke="#262626"/>
    <text x="20" y="34" font-size="13" fill="#A1A1A1">Approved in October</text>
    <text x="20" y="74" font-size="13" fill="#A1A1A1">PKR</text>
    <text x="54" y="76" font-size="30" font-weight="600" letter-spacing="-.8" fill="#EDEDED">155,500</text>
    <path d="M0 96.5H260" stroke="#262626"/>
    <text x="20" y="126" font-size="14" font-weight="600" fill="#EDEDED">S-14</text><text x="240" y="126" font-size="14" text-anchor="end" fill="#EDEDED">PKR 5,000</text>
    <path d="M0 140.5H260" stroke="#262626"/>
    <text x="20" y="166" font-size="14" font-weight="600" fill="#EDEDED">S-27</text><text x="240" y="166" font-size="14" text-anchor="end" fill="#EDEDED">PKR 7,500</text>
  </g>
</svg>